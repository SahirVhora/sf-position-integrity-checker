name: schema tests

on:
  push:
    branches: [main]
    paths: ['**.py', 'config/rules.yaml', 'templates/**', '.github/workflows/schema-tests.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: install deps
        run: pip install pyyaml pandas openpyxl
      - name: run schema tests
        run: python test_schema.py
