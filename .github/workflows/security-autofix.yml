name: Security hardening preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply assertion-guarded replacements
        run: python scripts/apply_security_hardening.py
      - name: Run Python syntax checks
        run: python -m py_compile config.py scripts/apply_security_hardening.py
      - name: Upload hardened files
        uses: actions/upload-artifact@v4
        with:
          name: hardened-files
          path: |
            templates/index.html
            config.py
          if-no-files-found: error
