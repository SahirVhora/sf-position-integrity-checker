[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-position-integrity-checker"
version = "0.1.0"
description = "Validates SAP SuccessFactors Position object data integrity via OData v2 checks"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28.0",
    "openpyxl>=3.1.0",
    "pandas>=1.5.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0.0",
    "PyYAML>=6.0",
    "lxml>=4.9.0",
    "signxml>=3.2.0",
    "cryptography>=50.0.0,<51",
    "Flask>=2.3.0",
    "sapsf-shared @ git+https://github.com/SahirVhora/sapsf-shared.git@da247058792dd30cfed282fd2001b7aaa5a34ff2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
sf-position-integrity-checker = "main:main"

[tool.setuptools]
packages = ["auth", "sf_position_integrity_resources"]
py-modules = [
    "main",
    "web_ui",
    "api_client",
    "fetchers",
    "validators",
    "reporters",
    "database",
    "config",
    "transformation_review",
    "assurance_adapter",
    "simulator",
    "remediation",
    "db_inspector",
    "mcp_server",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
sf_position_integrity_resources = ["*.yaml", "templates/*.html"]
